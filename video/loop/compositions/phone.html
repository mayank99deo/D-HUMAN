        <div id="c-i3" class="sitem" style="top: 582px"><span class="sitem-name">Omega-3, EPA and DHA</span><span class="sitem-why">For raised hsCRP</span></div>
        <p id="c-clean" class="h" style="top: 732px; font-size: 34px; font-variation-settings: 'wdth' 100; line-height: 1.15">Every brand clears the clean-label bar</p>
        <div id="c-k1" class="check" style="top: 826px"><span class="check-box"><svg class="tick" viewBox="0 0 24 24"><path id="c-t1" d="M4.5 12.5l5 5L19.5 7"/></svg></span>Third-party tested</div>
        <div id="c-k2" class="check" style="top: 884px"><span class="check-box"><svg class="tick" viewBox="0 0 24 24"><path id="c-t2" d="M4.5 12.5l5 5L19.5 7"/></svg></span>Every dose on the label</div>
        <div id="c-k3" class="check" style="top: 942px"><span class="check-box"><svg class="tick" viewBox="0 0 24 24"><path id="c-t3" d="M4.5 12.5l5 5L19.5 7"/></svg></span>FSSAI licensed</div>
        <div id="c-k4" class="check" style="top: 1000px"><span class="check-box"><svg class="tick" viewBox="0 0 24 24"><path id="c-t4" d="M4.5 12.5l5 5L19.5 7"/></svg></span>Traceable by batch</div>
        <p id="c-foot" class="h" style="top: 1082px; font-size: 34px; font-variation-settings: 'wdth' 100">No test result, no pitch.</p>
      </div>
    </div>

    <!-- 4. Retest: what moved, and the stack resets. -->
    <div id="r" class="scr clip" data-start="15.8" data-duration="3.8" data-track-index="2">
      <div id="r-in" class="in">
        <img class="mark" src="assets/brand/wordmark-black.svg" alt="D-Human" />
        <p class="p" style="top: 150px">3–4 months later</p>
        <h3 class="h" style="top: 196px">Your retest</h3>
        <div class="mrow" style="top: 300px">
          <div class="mrow-top"><span class="mrow-name">Vitamin D</span><span class="mrow-swap"><span id="r-o1" class="mrow-status is-flag">Low</span><span id="r-n1" class="mrow-status">In range</span></span></div>
          <div class="mrow-bar"><span class="mrow-band"></span><span id="r-g1" class="mrow-dot mrow-ghost" style="left: 12%"></span><span id="r-d1" class="mrow-dot" style="left: 42%"></span></div>
        </div>
        <div class="mrow" style="top: 420px">
          <div class="mrow-top"><span class="mrow-name">Evening cortisol</span><span class="mrow-swap"><span id="r-o2" class="mrow-status is-flag">High</span><span id="r-n2" class="mrow-status">In range</span></span></div>
          <div class="mrow-bar"><span class="mrow-band"></span><span id="r-g2" class="mrow-dot mrow-ghost" style="left: 88%"></span><span id="r-d2" class="mrow-dot" style="left: 68%"></span></div>
        </div>
        <div class="mrow" style="top: 540px">
          <div class="mrow-top"><span class="mrow-name">hsCRP</span><span class="mrow-swap"><span class="mrow-status is-flag">Raised</span></span></div>
          <div class="mrow-bar"><span class="mrow-band"></span><span id="r-g3" class="mrow-dot mrow-ghost" style="left: 84%"></span><span id="r-d3" class="mrow-dot" style="left: 79%"></span></div>
        </div>
        <div id="r-sum">
          <p class="h" style="top: 690px; font-size: 40px">2 of 3 back in range.</p>
          <p class="p" style="top: 746px">Your next stack follows the new numbers, not the old ones.</p>
        </div>
        <div id="r-panel">
          <p class="rp-title">New results reset the stack</p>
          <p class="rp-sub">Next retest in 3–4 months</p>
        </div>
      </div>
    </div>

    <!-- Back to the first screen, as it was at 0 s, so the loop has no seam. -->
    <div id="z" class="scr clip" data-start="19.45" data-duration="0.55" data-track-index="1">
      <div id="z-in" class="in">
        <img class="mark" src="assets/brand/wordmark-black.svg" alt="D-Human" />
        <h3 class="h" style="top: 150px">Your tests</h3>
        <p class="p" style="top: 218px">Booked for Saturday, at home</p>
        <div class="trow" style="top: 290px">
          <span class="trow-name">Blood</span><span class="trow-sub">At home, 7:30 am</span>
          <span class="tstat tstat-wait">Booked</span>
        </div>
        <div class="trow" style="top: 418px">
          <span class="trow-name">Urine</span><span class="trow-sub">Same visit</span>
          <span class="tstat tstat-wait">Booked</span>
        </div>
        <div class="trow" style="top: 546px">
          <span class="trow-name">Gut</span><span class="trow-sub">Home kit, posted back</span>
          <span class="tstat tstat-wait">Booked</span>
        </div>
        <div class="trow" style="top: 674px">
          <span class="trow-name">Body</span><span class="trow-sub">Composition scan</span>
          <span class="tstat tstat-wait">Booked</span>
        </div>
        <p class="h" style="top: 862px; font-size: 36px">At the lab</p>
        <div class="rail" style="top: 922px"></div>
        <p class="p" style="top: 962px">Then a doctor reviews every result</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const W = 520;
      // A touch lands two frames after its disc appears; the target responds on that frame.
      const TOUCH_DOWN = 2 / 30;

      const blurIn = (target, at, duration = 0.2) =>
        tl.fromTo(
          target,
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration, ease: "power4.out" },
          at,
        );
      // A second fromTo on the same properties must not apply its start values early.
      const blurOut = (target, at, duration = 0.15) =>
        tl.fromTo(
          target,
          { opacity: 1, filter: "blur(0px)" },
          { opacity: 0, filter: "blur(6px)", duration, ease: "power2.in", immediateRender: false },
          at,
        );
      const tap = (core, start) => {
        tl.fromTo(core, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: TOUCH_DOWN, ease: "power2.out" }, start);
        tl.fromTo(
          core,
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 0.92, duration: 0.2, ease: "power2.in", immediateRender: false },
          start + 0.183,
        );
        return start + TOUCH_DOWN;
      };
      const drawTick = (path, at) =>
        tl.fromTo(path, { strokeDashoffset: 21 }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, at);

      // 1. Test. The screen is already up at 0 s, matching the last frame.
      [
        ["#a-w1", "#a-d1", "#a-t1", 0.55],
        ["#a-w2", "#a-d2", "#a-t2", 0.85],
        ["#a-w3", "#a-d3", "#a-t3", 1.2],
        ["#a-w4", "#a-d4", "#a-t4", 1.5],
      ].forEach(([wait, done, tick, at]) => {
        tl.fromTo(wait, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, at);
        tl.fromTo(done, { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at + 0.05);
        drawTick(tick, at + 0.12);
      });
      tl.fromTo("#a-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.95, ease: "power1.inOut" }, 1.75);
      tl.fromTo("#a-banner", { y: -260 }, { y: 0, duration: 0.45, ease: "expo.out" }, 2.75);
      const tapBanner = tap("#a-touch-core", 3.3);
      tl.fromTo("#a-banner", { backgroundColor: "#000000" }, { backgroundColor: "#2b2b2b", duration: 0.08, immediateRender: false }, tapBanner);
      blurOut(["#a-in", "#a-banner"], 3.5);

      // 2a. Read: readings settle, flags invert, the stamp presses.
      blurIn("#b-in", 3.65);
      [
        ["#b-d1", 0.12],
        ["#b-d2", 0.52],
        ["#b-d3", 0.41],
        ["#b-d4", 0.88],
        ["#b-d5", 0.84],
      ].forEach(([dot, value], i) => {
        tl.fromTo(dot, { x: -value * W }, { x: 0, duration: 0.7, ease: "expo.out" }, 3.9 + i * 0.1);
      });
      ["#b-s1", "#b-s4", "#b-s5"].forEach((status, i) => {
        tl.fromTo(
          status,
          { backgroundColor: "rgba(0,0,0,0)", color: "#5c5c5c" },
          { backgroundColor: "#000000", color: "#ffffff", duration: 0.2, ease: "power2.out" },
          4.8 + i * 0.12,
        );
      });
      blurIn("#b-sum", 5.25);
      tl.fromTo(
        "#b-stamp",
        { opacity: 0, scale: 1.35, rotation: -6 },
        { opacity: 1, scale: 1, rotation: -6, duration: 0.2, ease: "power4.out" },
        5.55,
      );
      const tapVitD = tap("#b-touch-core", 6.0);
      tl.fromTo("#b-hl", { opacity: 0 }, { opacity: 1, duration: 0.08 }, tapVitD);
      blurOut(["#b-in", "#b-hl"], 6.4);

      // 2b. Read: Vitamin D in plain words.
      blurIn("#d-in", 6.55);
      tl.fromTo("#d-marker", { x: -0.14 * W }, { x: 0, duration: 0.7, ease: "expo.out" }, 6.8);
      tl.fromTo("#d-flag", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 7.35);
      ["#d-r1", "#d-r2", "#d-r3"].forEach((row, i) => {
        tl.fromTo(row, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 7.6 + i * 0.25);
      });
      blurIn("#d-foot", 8.45);
      blurOut("#d-in", 9.75);

      // 3a. Stack: two answers, then build.
      blurIn("#q-in", 9.85);
      const tapRun = tap("#q-touch-1-core", 10.3);
      tl.set("#q-run", { backgroundColor: "#000000", color: "#ffffff" }, tapRun);
      const tapHyrox = tap("#q-touch-2-core", 10.75);
      tl.set("#q-hyrox", { backgroundColor: "#000000", color: "#ffffff" }, tapHyrox);
      const tapBuild = tap("#q-touch-3-core", 11.2);

      // 3b. The button's block grows into the header band; the stack lands; the bar is checked.
      tl.fromTo(
        "#c-morph",
        { clipPath: "inset(1056px 40px 144px 40px)" },
        { clipPath: "inset(0px 0px 966px 0px)", duration: 0.35, ease: "power3.inOut" },
        tapBuild,
      );
      tl.fromTo("#c-morph-label", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, tapBuild);
      blurOut("#q-in", 11.28, 0.18);
      blurIn("#c-band", 11.55);
      ["#c-i1", "#c-i2", "#c-i3"].forEach((item, i) => {
        tl.fromTo(
          item,
          { opacity: 0, x: 36, filter: "blur(6px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
          11.7 + i * 0.25,
        );
      });
      blurIn("#c-clean", 12.75);
      [
        ["#c-k1", "#c-t1"],
        ["#c-k2", "#c-t2"],
        ["#c-k3", "#c-t3"],
        ["#c-k4", "#c-t4"],
      ].forEach(([row, tick], i) => {
        const at = 13.0 + i * 0.25;
        tl.fromTo(row, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, at);
        drawTick(tick, at + 0.12);
      });
      blurIn("#c-foot", 14.2);
      blurOut(["#c-in", "#c-morph"], 15.65);

      // 4. Retest: the old readings stay as ghosts; the new ones move.
      blurIn("#r-in", 15.85);
      ["#r-g1", "#r-g2", "#r-g3"].forEach((ghost) => {
        tl.fromTo(ghost, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 16.15);
      });
      [
        ["#r-d1", 0.12 - 0.42],
        ["#r-d2", 0.88 - 0.68],
        ["#r-d3", 0.84 - 0.79],
      ].forEach(([dot, shift], i) => {
        tl.fromTo(dot, { x: shift * W }, { x: 0, duration: 0.9, ease: "power2.inOut" }, 16.35 + i * 0.15);
      });
      [
        ["#r-o1", "#r-n1", 16.95],
        ["#r-o2", "#r-n2", 17.1],
      ].forEach(([before, after, at]) => {
        tl.fromTo(before, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, at);
        tl.fromTo(after, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at + 0.1);
      });
      blurIn("#r-sum", 17.45);
      tl.fromTo("#r-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 17.8);
      blurOut("#r-in", 19.4);

      // Back to the start.
      blurIn("#z-in", 19.5);

      // The clock turns white over the stack's black band.
      tl.fromTo("#ph-clock", { color: "#000000" }, { color: "#ffffff", duration: 0.15 }, 11.4);
      tl.fromTo("#ph-clock", { color: "#ffffff" }, { color: "#000000", duration: 0.15, immediateRender: false }, 15.65);

      // The tab bar follows the chapter, in step with each screen change.
      [
        [3.6, 0, 1],
        [9.8, 1, 2],
        [15.8, 2, 3],
        [19.45, 3, 0],
      ].forEach(([at, from, to], i) => {
        tl.fromTo("#ph-tab-bar", { x: from * 150 }, { x: to * 150, duration: 0.3, ease: "power2.inOut", immediateRender: i === 0 }, at);
        tl.fromTo(`#tab-${from}`, { color: "#000000" }, { color: "#5c5c5c", duration: 0.2, immediateRender: false }, at);
        tl.fromTo(`#tab-${to}`, { color: "#5c5c5c" }, { color: "#000000", duration: 0.2, immediateRender: false }, at);
      });

      window.__timelines["phone"] = tl;
    })();
  </script>
</template>
