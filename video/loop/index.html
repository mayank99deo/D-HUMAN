<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=1296" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 1296px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="600"
      data-height="1296"
    >
      <!-- The phone screen: test, read, stack, retest, and back to the start. -->
      <div
        id="phone"
        class="clip"
        data-composition-id="phone"
        data-composition-src="compositions/phone.html"
        data-start="0"
        data-duration="20"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="600"
        data-height="1296"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
