        <div data-hf-id="hf-v66f" class="mrow-top"><span data-hf-id="hf-ngxj" class="mrow-name">hsCRP</span><span data-hf-id="hf-y1cu" class="mrow-status is-flag">Raised</span></div>
        <div data-hf-id="hf-ui5p" class="mrow-bar"><span data-hf-id="hf-wuvm" class="mrow-band"></span><span data-hf-id="hf-4m5m" class="mrow-dot" style="left: 84%"></span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const ROW_W = 380;
      const SHEET_SHIFT = -420;
      // A touch lands two frames after its disc appears (registry touch-indicator spec);
      // the target responds on that same frame.
      const TOUCH_DOWN = 2 / 30;

      const blurIn = (target, at, duration = 0.18) =>
        tl.fromTo(
          target,
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration, ease: "power4.out" },
          at,
        );
      // A second fromTo on the same properties must not apply its start values early.
      const blurOut = (target, at, duration = 0.15) =>
        tl.fromTo(
          target,
          { opacity: 1, filter: "blur(0px)" },
          { opacity: 0, filter: "blur(6px)", duration, ease: "power2.in", immediateRender: false },
          at,
        );

      // 1. The report: readings settle, the stamp presses, the out-of-range rows flag.
      blurIn("#st-t1-h", 0.05);
      [
        ["#st-sr-vitd-d", 0.12],
        ["#st-sr-b12-d", 0.52],
        ["#st-sr-a1c-d", 0.41],
        ["#st-sr-cort-d", 0.88],
        ["#st-sr-crp-d", 0.84],
      ].forEach(([dot, value], i) => {
        tl.fromTo(dot, { x: -value * ROW_W }, { x: 0, duration: 0.7, ease: "expo.out" }, 0.2 + i * 0.1);
      });
      tl.fromTo(
        "#st-stamp",
        { opacity: 0, scale: 1.35, rotation: -7 },
        { opacity: 1, scale: 1, rotation: -7, duration: 0.2, ease: "power4.out" },
        1.25,
      );
      ["#st-sr-vitd-s", "#st-sr-cort-s", "#st-sr-crp-s"].forEach((status, i) => {
        tl.fromTo(
          status,
          { backgroundColor: "rgba(0,0,0,0)", color: "#5c5c5c" },
          { backgroundColor: "#000000", color: "#ffffff", duration: 0.2, ease: "power2.out" },
          1.55 + i * 0.12,
        );
      });
      blurOut("#st-t1-h", 2.05);

      // 2. The pull: the sheet makes room, the phone arrives, flagged rows carry across.
      tl.fromTo("#st-sheet", { x: 0 }, { x: SHEET_SHIFT, duration: 0.45, ease: "power2.inOut" }, 2.2);
      tl.fromTo(
        "#st-phone",
        { x: 760, filter: "blur(14px)" },
        { x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" },
        2.35,
      );
      // Report rows (scaled 1.6 on the sheet) and their landing slots in the app.
      const SHEET_X = 980 + SHEET_SHIFT + 76;
      const carries = [
        ["#st-fly-1", "#st-sr-vitd", 270 + 0 * 147.2, 340],
        ["#st-fly-2", "#st-sr-cort", 270 + 3 * 147.2, 448],
        ["#st-fly-3", "#st-sr-crp", 270 + 4 * 147.2, 556],
      ];
      carries.forEach(([fly, sheetRow, fromY, toY], i) => {
        const at = 2.8 + i * 0.08;
        tl.set(sheetRow, { opacity: 0 }, at);
        tl.fromTo(
          fly,
          { x: SHEET_X - 1306, y: fromY - toY, scale: 1.6, transformOrigin: "0 0", opacity: 1 },
          { x: 0, y: 0, scale: 1, duration: 0.65, ease: "power2.inOut" },
          at,
        );
        // Motion blur peaks mid-move, at the fastest frame.
        tl.to(
          fly,
          { keyframes: { "0%": { filter: "blur(0px)" }, "50%": { filter: "blur(6px)" }, "100%": { filter: "blur(0px)" } }, duration: 0.65, ease: "none" },
          at,
        );
      });
      tl.fromTo(
        "#st-sheet",
        { x: SHEET_SHIFT, opacity: 1, filter: "blur(0px)" },
        { x: SHEET_SHIFT - 480, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in", immediateRender: false },
        2.9,
      );
      // The carried rows become the app's own rows.
      tl.set(["#st-pr-1", "#st-pr-2", "#st-pr-3"], { opacity: 1 }, 3.65);
      tl.set(["#st-fly-1", "#st-fly-2", "#st-fly-3"], { opacity: 0 }, 3.65);

      // 3. On the phone.
      blurIn("#st-t2-h", 3.35);
      blurOut("#st-t2-h", 5.28);

      // 4. The answers: a blur swap on the white screen, then three taps.
      blurOut("#st-list-in", 5.28);
      blurIn("#st-q-in", 5.43, 0.2);
      blurIn("#st-t3-h", 5.5);
      // Each disc appears on the glass, dwells, then lifts; it never hovers or travels.
      const tap = (core, start) => {
        tl.fromTo(core, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: TOUCH_DOWN, ease: "power2.out" }, start);
        tl.fromTo(
          core,
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 0.92, duration: 0.2, ease: "power2.in", immediateRender: false },
          start + 0.183,
        );
        return start + TOUCH_DOWN;
      };
      const tapRun = tap("#st-touch-1-core", 5.8);
      tl.set("#st-chip-run", { backgroundColor: "#000000", color: "#ffffff" }, tapRun);
      const tapHyrox = tap("#st-touch-2-core", 6.3);
      tl.set("#st-chip-hyrox", { backgroundColor: "#000000", color: "#ffffff" }, tapHyrox);
      const tapBuild = tap("#st-touch-3-core", 6.9);
      blurOut("#st-t3-h", 7.27);

      // 5. The stack: the button's black block grows into the header band.
      tl.fromTo(
        "#st-morph",
        { clipPath: "inset(832px 30px 40px 30px)" },
        { clipPath: "inset(0px 0px 650px 0px)", duration: 0.35, ease: "power3.inOut" },
        tapBuild,
      );
      tl.fromTo("#st-morph-label", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, tapBuild);
      blurOut("#st-q-in", 6.98, 0.18);
      blurIn("#st-band-copy", 7.25, 0.2);
      blurIn("#st-t4-h", 7.45);
      ["#st-si-1", "#st-si-2", "#st-si-3"].forEach((item, i) => {
        tl.fromTo(
          item,
          { opacity: 0, x: 36, filter: "blur(6px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" },
          7.4 + i * 0.3,
        );
      });
      blurIn("#st-stack-foot", 8.45, 0.2);
      blurOut("#st-t4-h", 9.95);

      // 6. The screen becomes the world: it grows past the frame into the pack.
      tl.fromTo(
        "#st-phone",
        { x: 0, scale: 1, transformOrigin: "234px 484px" },
        { x: -536, scale: 4.6, duration: 0.6, ease: "power2.inOut", immediateRender: false },
        10.0,
      );
      tl.fromTo("#st-screen", { borderRadius: 52 }, { borderRadius: 0, duration: 0.6, ease: "power2.inOut" }, 10.0);
      tl.fromTo(
        ["#st-stack-in", "#st-morph", "#st-clock", "#st-island"],
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        10.0,
      );

      window.__timelines["stage"] = tl;
    })();
  </script>
</template>
