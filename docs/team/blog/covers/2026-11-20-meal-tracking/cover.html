<!doctype html>
<!--
  Cover: "Meal tracking in India: who does it, and why it matters"
  (slug meal-tracking-india, topic Calories). Graphic designer, 2026-11-20.

  The idea: the pencil marks on a door frame that record a child growing up, redrawn
  for adult women. One upright gauge, ticked every percentage point up to 50 (half of
  all women), stands on a flat ground line. Three marks climb it: the share of women
  with high blood pressure in their 30s, 40s and 60s. Each mark is drawn to the same
  scale both ways (its height and its length), so the three read-outs step up a single
  slope. The faint lines behind are the brand's contour lines, seeded from the slug like
  components/blog/ContourCover.tsx, run upright here like wood grain.

  Series: the sibling of post 1's cover (2026-11-19-preventive-health, "Soundings"). That
  one hangs three plumb lines down from one flat surface over horizontal layers; this one
  raises three marks up one upright gauge over upright grain. Same parts (4 px white rules,
  ticks every point with a longer one every 5, 30 px square read-outs, display-num
  numbers, a graphite line of words) and the same scale: 1 percentage point = 12 px on
  every cover, so covers can be compared by eye. Numbers here are 104 px, not 112, so
  48.7% keeps a margin in the 1:1 crop.

  Data: National Family Health Survey (NFHS-5), 2019–21, India, which measured blood
  pressure. The share of women with high blood pressure ("high on the day, or on medicine
  for it", in the post's words) in the age bands 30–39, 40–49 and 60–69, as written in the
  post. The post gives ages 50–59 in two halves (50–54 and 55–59), so they make no single
  mark; the cover skips them, as the post's own summary line does ("one in eight in her
  30s, one in four in her 40s, nearly one in two in her 60s"). The age bands are labelled,
  and nothing is placed by age, so the gap isn't hidden. If a figure changes, edit DATA
  below and re-render with ./render.sh. Every length is drawn to scale from these numbers.

  Master: 1600 x 1067 (3:2). Everything that matters sits inside the central
  1067 x 800 safe zone, so the 2:1, 4:3 and 1:1 crops all keep it. check() below marks
  the page with data-unsafe if anything strays out of it or two parts collide;
  render.sh prints that and stops.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover: meal tracking in India</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../../../../../video/intro/assets/fonts/archivo-latin-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
  text { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-feature-settings: "tnum" 1; }
  /* display-num in app/globals.css: wdth 125, 800, tracking -0.02em */
  .num { font-variation-settings: "wdth" 125; font-weight: 800; letter-spacing: -0.02em; }
  /* semiwide in app/globals.css: wdth 112 */
  .name { font-variation-settings: "wdth" 112; font-weight: 650; letter-spacing: -0.005em; }
  .feel { font-variation-settings: "wdth" 112; font-weight: 600; }
  .halo { paint-order: stroke; stroke: #000; stroke-linejoin: round; }
</style>
</head>
<body>
<svg id="cover" xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067"></svg>
<script>
// ---- Data and layout: the only part to edit ---------------------------------------------
// NFHS-5 (2019-21), women with high blood pressure, by age. Keep the post's decimals:
// pct is a string so "25.0" stays "25.0".
const DATA = {
  slug: "meal-tracking-india",
  title: "Women with high blood pressure",
  groundY: 898,       // the ground line: 0%
  staffX: 335,        // the gauge
  pxPerPoint: 12,     // the series scale: one percentage point in px (post 1 uses 12 too)
  staffTop: 50,       // the gauge runs to 50%, half of all women
  items: [
    { pct: "12.9", age: "30–39" },
    { pct: "25.0", age: "40–49" },
    { pct: "48.7", age: "60–69" },
  ],
};

// ---- Constants -----------------------------------------------------------------------------
const W = 1600, H = 1067;
const SAFE = { x0: (W - 1067) / 2, x1: (W + 1067) / 2, y0: (H - 800) / 2, y1: (H + 800) / 2 };
const INK = "#000", PAPER = "#fff", GRAPHITE = "#8c8c8c"; // graphite: --color-graphite, 6.2:1 on ink
// Numbers are display-num at 104, a step under post 1's 112, so 48.7% keeps a margin in the 1:1 crop.
const NUM = 104, PCT = 52, NAME = 38, TITLE = 46;
const GAP = 20;        // read-out to number
const TICK = 12, MAJOR = 22; // ticks every point, longer every 5 points (as post 1)
const TEXT_X = DATA.staffX + 14; // one left edge for the title and the age bands, just inside the gauge
const AGE_RAISE = 28;  // the age band's baseline, above its mark (clears the read-out at any value)
const CAP = 0.72;   // Archivo's cap and figure height, as a share of the font size
const HEAD = 30;    // the square read-out, centred on the value
const RULE = 4;     // every white rule

const svg = document.getElementById("cover");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent = svg) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
};
const r1 = (n) => Math.round(n * 10) / 10;
const yOf = (value) => DATA.groundY - value * DATA.pxPerPoint;
const xOf = (value) => DATA.staffX + value * DATA.pxPerPoint;

// ---- Seeded noise (same hash and generator as ContourCover.tsx) --------------------------
function hash(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function seeded(seed) {
  let a = seed;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = seeded(hash(DATA.slug));
const perm = Array.from({ length: 256 }, (_, i) => i);
for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
const P = [...perm, ...perm];
const grad = (h, x, y) => { const a = (h / 256) * Math.PI * 2; return Math.cos(a) * x + Math.sin(a) * y; };
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function perlin(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = P[P[xi] + yi], ab = P[P[xi] + yi + 1], ba = P[P[xi + 1] + yi], bb = P[P[xi + 1] + yi + 1];
  const x1 = grad(aa, xf, yf) + u * (grad(ba, xf - 1, yf) - grad(aa, xf, yf));
  const x2 = grad(ab, xf, yf - 1) + u * (grad(bb, xf - 1, yf - 1) - grad(ab, xf, yf - 1));
  return x1 + v * (x2 - x1);
}
function fbm(x, y) {
  let s = 0, amp = 1, f = 1, norm = 0;
  for (let o = 0; o < 4; o++) { s += amp * perlin(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
  return s / norm;
}

// ---- The grain: upright contour lines above the ground (marching squares, chained, smoothed)
function grain() {
  const bottom = DATA.groundY - 10, cell = 5;
  const nx = Math.ceil(W / cell) + 3, ny = Math.ceil(bottom / cell) + 3;
  const X = (i) => (i - 1) * cell, Y = (j) => (j - 1) * cell;
  const LEVELS = 21;
  const val = [];
  for (let j = 0; j < ny; j++) {
    const row = [];
    for (let i = 0; i < nx; i++) {
      const x = X(i), y = Y(j);
      const rise = Math.min(1, Math.max(0, (DATA.groundY - y) / DATA.groundY));
      const warp = fbm(x / 700 + 3.3, y / 700 + 7.1) * 2.2;
      // Mostly upright lines that part around knots, like grain in a door frame.
      // Calm near the ground, more movement higher up: it builds with the years.
      const swell = 0.25 + 0.75 * Math.min(1, rise * 1.3);
      row.push((x / W) * LEVELS + 3.4 * swell * fbm(x / 300 + 11.7, y / 640 + warp * swell));
    }
    val.push(row);
  }
  const g = el("g", { fill: "none", stroke: PAPER, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" });
  for (let L = -2; L < LEVELS + 3; L++) {
    const level = L + 0.5;
    const segs = [];
    const pt = (key) => {
      const [kind, i, j] = key.split(",");
      const a = +i, b = +j;
      if (kind === "h") { const v0 = val[b][a], v1 = val[b][a + 1]; const t = (level - v0) / (v1 - v0); return [X(a) + t * cell, Y(b)]; }
      const v0 = val[b][a], v1 = val[b + 1][a]; const t = (level - v0) / (v1 - v0); return [X(a), Y(b) + t * cell];
    };
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const tl = val[j][i] > level, tr = val[j][i + 1] > level, br = val[j + 1][i + 1] > level, bl = val[j + 1][i] > level;
      const c = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
      if (c === 0 || c === 15) continue;
      const T = `h,${i},${j}`, B = `h,${i},${j + 1}`, Lf = `v,${i},${j}`, R = `v,${i + 1},${j}`;
      const centre = (val[j][i] + val[j][i + 1] + val[j + 1][i] + val[j + 1][i + 1]) / 4 > level;
      const table = {
        1: [[Lf, B]], 2: [[B, R]], 3: [[Lf, R]], 4: [[T, R]], 6: [[T, B]], 7: [[Lf, T]], 8: [[Lf, T]],
        9: [[T, B]], 11: [[T, R]], 12: [[Lf, R]], 13: [[B, R]], 14: [[Lf, B]],
        5: centre ? [[Lf, T], [B, R]] : [[Lf, B], [T, R]],
        10: centre ? [[T, R], [Lf, B]] : [[Lf, T], [B, R]],
      };
      for (const s of table[c]) segs.push(s);
    }
    // Chain segments that share an edge crossing into polylines.
    const ends = new Map();
    segs.forEach((s, k) => s.forEach((e) => { if (!ends.has(e)) ends.set(e, []); ends.get(e).push(k); }));
    const used = new Uint8Array(segs.length);
    const lines = [];
    for (let k = 0; k < segs.length; k++) {
      if (used[k]) continue;
      used[k] = 1;
      const chain = [segs[k][0], segs[k][1]];
      for (const dir of [1, -1]) {
        for (;;) {
          const tip = dir === 1 ? chain[chain.length - 1] : chain[0];
          const next = (ends.get(tip) || []).find((m) => !used[m]);
          if (next === undefined) break;
          used[next] = 1;
          const other = segs[next][0] === tip ? segs[next][1] : segs[next][0];
          if (dir === 1) chain.push(other); else chain.unshift(other);
        }
      }
      if (chain.length > 6) lines.push(chain.map(pt));
    }
    for (const pts of lines) {
      const ys = pts.map((p) => p[1]);
      const rise = Math.min(1, Math.max(0, (DATA.groundY - ys.reduce((a, b) => a + b, 0) / ys.length) / DATA.groundY));
      let d = `M${r1(pts[0][0])} ${r1(pts[0][1])}`;
      for (let m = 1; m < pts.length - 1; m++) {
        const mx = (pts[m][0] + pts[m + 1][0]) / 2, my = (pts[m][1] + pts[m + 1][1]) / 2;
        d += `Q${r1(pts[m][0])} ${r1(pts[m][1])} ${r1(mx)} ${r1(my)}`;
      }
      const last = pts[pts.length - 1];
      d += `L${r1(last[0])} ${r1(last[1])}`;
      el("path", { d, "stroke-opacity": (0.08 + 0.12 * rise).toFixed(3) }, g);
    }
  }
}

// ---- Draw -------------------------------------------------------------------------------
el("rect", { x: 0, y: 0, width: W, height: H, fill: INK });
grain();

// The ground: 0%, full bleed like post 1's surface.
el("rect", { x: 0, y: DATA.groundY - RULE / 2, width: W, height: RULE, fill: PAPER });

// The gauge: an upright rule from the ground to 50%, ticked every point on its outer side,
// a longer tick every 5 points. Its top end is 50%, so 48.7% stops just short of it.
const topY = yOf(DATA.staffTop);
el("rect", { x: DATA.staffX - RULE / 2, y: topY - RULE / 2, width: RULE, height: DATA.groundY - topY + RULE / 2, fill: PAPER });
for (let p = 1; p <= DATA.staffTop; p++) {
  const y = yOf(p);
  const major = p % 5 === 0;
  const w = major ? MAJOR : TICK;
  el("rect", { x: DATA.staffX - RULE / 2 - w, y: y - (major ? 1.5 : 1), width: w, height: major ? 3 : 2, fill: PAPER, "fill-opacity": major ? 0.95 : 0.55 });
}

// The title, a quiet line of words like post 1's "Feels fine".
const title = el("text", { x: TEXT_X, y: 0, class: "feel halo", "font-size": TITLE, fill: GRAPHITE, "stroke-width": 14 });
title.textContent = DATA.title;

// The marks: each a rule out from the gauge, as long as it is high, ending in a read-out.
const parts = [];
for (const item of DATA.items) {
  const value = Number(item.pct);
  const y = yOf(value), x = xOf(value);
  const g = el("g", {});
  el("rect", { x: DATA.staffX, y: y - RULE / 2, width: x - DATA.staffX, height: RULE, fill: PAPER }, g);
  const head = el("rect", { x: x - HEAD / 2, y: y - HEAD / 2, width: HEAD, height: HEAD, fill: PAPER }, g);

  // The number, figures centred on the mark, just past the read-out.
  const num = el("text", { x: x + HEAD / 2 + GAP, y: y + Math.round((NUM * CAP) / 2), class: "num halo", "font-size": NUM, fill: PAPER, "stroke-width": 18 }, g);
  num.textContent = item.pct;
  const pct = el("tspan", { "font-size": PCT, dx: 6, dy: -Math.round(NUM * CAP - PCT * CAP) }, num);
  pct.textContent = "%";

  // The age band, written on the mark by the gauge, like a name on a door frame.
  const age = el("text", { x: TEXT_X, y: y - AGE_RAISE, class: "name halo", "font-size": NAME, fill: PAPER, "stroke-width": 14 }, g);
  age.textContent = item.age;
  parts.push({ item, value, y, x, num, age, head });
}

// Place the title above the gauge, clear of the top mark's band.
title.setAttribute("y", Math.round(Math.min(topY, ...parts.map((p) => p.y)) - AGE_RAISE - NAME * CAP - 44));

// ---- Checks: nothing that matters outside the safe zone, nothing on top of anything else ----
function check() {
  const problems = [];
  const box = (n) => { const b = n.getBBox(); return { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height }; };
  const hit = (a, b, pad) => a.x0 < b.x1 + pad && b.x0 < a.x1 + pad && a.y0 < b.y1 + pad && b.y0 < a.y1 + pad;
  const named = [{ name: "title", b: box(title) }];
  for (const p of parts) {
    named.push({ name: `${p.item.pct} number`, b: box(p.num), own: p });
    named.push({ name: `${p.item.pct} age`, b: box(p.age), own: p });
    named.push({ name: `${p.item.pct} read-out`, b: box(p.head), own: p });
  }
  // The gauge and its ticks, and each mark's rule.
  const solids = [{ name: "gauge", b: { x0: DATA.staffX - RULE / 2 - MAJOR, y0: topY - 2, x1: DATA.staffX + RULE / 2, y1: DATA.groundY } }];
  for (const p of parts) solids.push({ name: `${p.item.pct} mark`, b: { x0: DATA.staffX, y0: p.y - RULE / 2, x1: p.x, y1: p.y + RULE / 2 }, own: p });

  for (const p of parts) if (p.value > DATA.staffTop) problems.push(`${p.item.pct} is above the gauge: raise staffTop`);
  for (const n of named) {
    const b = n.b;
    if (b.x0 < SAFE.x0 || b.x1 > SAFE.x1 || b.y0 < SAFE.y0 || b.y1 > SAFE.y1)
      problems.push(`${n.name} outside safe zone: ${Math.round(b.x0)},${Math.round(b.y0)} to ${Math.round(b.x1)},${Math.round(b.y1)}`);
  }
  for (let i = 0; i < named.length; i++) for (let j = i + 1; j < named.length; j++) {
    const a = named[i], b = named[j];
    if (a.own && a.own === b.own && (a.name.endsWith("read-out") || b.name.endsWith("read-out"))) {
      if (hit(a.b, b.b, 4)) problems.push(`${a.name} touches ${b.name}`);
      continue;
    }
    if (hit(a.b, b.b, 16)) problems.push(`${a.name} crowds ${b.name}`);
  }
  for (const n of named) for (const s of solids) {
    if (n.own && n.own === s.own) continue;
    if (hit(n.b, s.b, 8)) problems.push(`${n.name} sits on the ${s.name}`);
  }
  const round = (b) => [b.x0, b.y0, b.x1, b.y1].map(Math.round);
  // How far the drawing sits from each edge of the safe zone (the 1:1 crop's sides, the 2:1 crop's top and bottom).
  const all = [...named.map((n) => n.b), ...solids.map((s) => s.b)];
  const margins = { left: Math.round(Math.min(...all.map((b) => b.x0)) - SAFE.x0), right: Math.round(SAFE.x1 - Math.max(...all.map((b) => b.x1))), top: Math.round(Math.min(...all.map((b) => b.y0)) - SAFE.y0), bottom: Math.round(SAFE.y1 - DATA.groundY - RULE / 2) };
  document.body.dataset.report = JSON.stringify({ margins, boxes: named.map((n) => [n.name, ...round(n.b)]), safe: round({ x0: SAFE.x0, y0: SAFE.y0, x1: SAFE.x1, y1: SAFE.y1 }), problems });
  if (problems.length) document.body.dataset.unsafe = problems.join("; ");
}
document.fonts.ready.then(() => { check(); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
