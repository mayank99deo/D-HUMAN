<!doctype html>
<!--
  Cover: "Preventive health checkups in India: what the numbers say"
  (slug preventive-health-checkup-india, topic Blood tests). Graphic designer, 2026-11-19.

  The idea: a flat line marked "Feels fine" is how health usually gets judged. Under it,
  three plumb lines, ticked every percentage point, drop to the share of adults in India
  with each condition. You can't feel it; you can measure it. The faint layers below
  are drawn in the brand's contour-line language, seeded from the slug like
  components/blog/ContourCover.tsx, so the drawing never changes between renders.

  Data: ICMR-INDIAB national study (Anjana RM et al., Lancet Diabetes Endocrinol 2023;
  11(7): 474-489), adults aged 20 and over. If a figure changes, edit DATA below and
  re-render with ./render.sh. Lengths are drawn to scale from these numbers.

  Master: 1600 x 1067 (3:2). Everything that matters sits inside the central
  1067 x 800 safe zone, so the 2:1, 4:3 and 1:1 crops all keep it (checkSafeZone below
  marks the page with data-unsafe if anything strays out of it or labels collide).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover: preventive health checkups in India</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../../../../../video/intro/assets/fonts/archivo-latin-variable.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  svg { display: block; }
  text { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-feature-settings: "tnum" 1; }
  /* display-num in app/globals.css: wdth 125, 800, tracking -0.02em */
  .num { font-variation-settings: "wdth" 125; font-weight: 800; letter-spacing: -0.02em; }
  /* semiwide in app/globals.css: wdth 112 */
  .name { font-variation-settings: "wdth" 112; font-weight: 650; letter-spacing: -0.005em; }
  .feel { font-variation-settings: "wdth" 112; font-weight: 600; }
  .halo { paint-order: stroke; stroke: #000; stroke-linejoin: round; }
</style>
</head>
<body>
<svg id="cover" xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067"></svg>
<script>
// ---- Data and layout: the only part to edit ---------------------------------------------
const DATA = {
  slug: "preventive-health-checkup-india",
  feel: "Feels fine",
  surfaceY: 255,      // the "Feels fine" line
  pxPerPoint: 12,     // one percentage point of adults, in px; all three use the same scale
  items: [
    { value: 11.4, name: ["Diabetes"], x: 350, align: "start" },
    { value: 15.3, name: ["Prediabetes"], x: 800, align: "start" },
    { value: 35.5, name: ["High blood pressure"], x: 1250, align: "end" },
  ],
};

// ---- Constants -----------------------------------------------------------------------------
const W = 1600, H = 1067;
const SAFE = { x0: (W - 1067) / 2, x1: (W + 1067) / 2, y0: (H - 800) / 2, y1: (H + 800) / 2 };
const INK = "#000", PAPER = "#fff", GRAPHITE = "#8c8c8c";
const NUM = 112, PCT = 56, NAME = 46, NAME_LH = 54, FEEL = 46;
const HEAD = 30; // the square read-out marker, centred on the value

const svg = document.getElementById("cover");
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent = svg) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
};
const r1 = (n) => Math.round(n * 10) / 10;

// ---- Seeded noise (same hash and generator as ContourCover.tsx) --------------------------
function hash(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function seeded(seed) {
  let a = seed;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = seeded(hash(DATA.slug));
const perm = Array.from({ length: 256 }, (_, i) => i);
for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
const P = [...perm, ...perm];
const grad = (h, x, y) => { const a = (h / 256) * Math.PI * 2; return Math.cos(a) * x + Math.sin(a) * y; };
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function perlin(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = P[P[xi] + yi], ab = P[P[xi] + yi + 1], ba = P[P[xi + 1] + yi], bb = P[P[xi + 1] + yi + 1];
  const x1 = grad(aa, xf, yf) + u * (grad(ba, xf - 1, yf) - grad(aa, xf, yf));
  const x2 = grad(ab, xf, yf - 1) + u * (grad(bb, xf - 1, yf - 1) - grad(ab, xf, yf - 1));
  return x1 + v * (x2 - x1);
}
function fbm(x, y) {
  let s = 0, amp = 1, f = 1, norm = 0;
  for (let o = 0; o < 4; o++) { s += amp * perlin(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
  return s / norm;
}

// ---- The layers: wavy strata under the surface (marching squares, chained and smoothed) ----
function strata() {
  const top = DATA.surfaceY + 10, cell = 5;
  const nx = Math.ceil(W / cell) + 3, ny = Math.ceil((H - top) / cell) + 3;
  const X = (i) => (i - 1) * cell, Y = (j) => top + (j - 1) * cell;
  const LEVELS = 15;
  const val = [];
  for (let j = 0; j < ny; j++) {
    const row = [];
    for (let i = 0; i < nx; i++) {
      const x = X(i), y = Y(j);
      const depth = (y - DATA.surfaceY) / (H - DATA.surfaceY);
      const warp = fbm(x / 700 + 7.1, y / 700 + 3.3) * 2.2;
      // Mostly horizontal bands that swell, pinch and close up with depth, like layers
      // laid down over years.
      // Calm just under the surface, more swell further down: it builds quietly.
      const swell = 0.2 + 0.8 * Math.min(1, depth * 1.3);
      row.push(Math.pow(depth, 1.25) * LEVELS + 3.6 * swell * fbm(x / 640 + warp * swell, y / 280 + 11.7));
    }
    val.push(row);
  }
  const g = el("g", { fill: "none", stroke: PAPER, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" });
  for (let L = 1; L < LEVELS + 2; L++) {
    const level = L - 0.5;
    const segs = [];
    const pt = (key) => {
      const [kind, i, j] = key.split(",");
      const a = +i, b = +j;
      if (kind === "h") { const v0 = val[b][a], v1 = val[b][a + 1]; const t = (level - v0) / (v1 - v0); return [X(a) + t * cell, Y(b)]; }
      const v0 = val[b][a], v1 = val[b + 1][a]; const t = (level - v0) / (v1 - v0); return [X(a), Y(b) + t * cell];
    };
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const tl = val[j][i] > level, tr = val[j][i + 1] > level, br = val[j + 1][i + 1] > level, bl = val[j + 1][i] > level;
      const c = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
      if (c === 0 || c === 15) continue;
      const T = `h,${i},${j}`, B = `h,${i},${j + 1}`, Lf = `v,${i},${j}`, R = `v,${i + 1},${j}`;
      const centre = (val[j][i] + val[j][i + 1] + val[j + 1][i] + val[j + 1][i + 1]) / 4 > level;
      const table = {
        1: [[Lf, B]], 2: [[B, R]], 3: [[Lf, R]], 4: [[T, R]], 6: [[T, B]], 7: [[Lf, T]], 8: [[Lf, T]],
        9: [[T, B]], 11: [[T, R]], 12: [[Lf, R]], 13: [[B, R]], 14: [[Lf, B]],
        5: centre ? [[Lf, T], [B, R]] : [[Lf, B], [T, R]],
        10: centre ? [[T, R], [Lf, B]] : [[Lf, T], [B, R]],
      };
      for (const s of table[c]) segs.push(s);
    }
    // Chain segments that share an edge crossing into polylines.
    const ends = new Map();
    segs.forEach((s, k) => s.forEach((e) => { if (!ends.has(e)) ends.set(e, []); ends.get(e).push(k); }));
    const used = new Uint8Array(segs.length);
    const lines = [];
    for (let k = 0; k < segs.length; k++) {
      if (used[k]) continue;
      used[k] = 1;
      const chain = [segs[k][0], segs[k][1]];
      for (const dir of [1, -1]) {
        for (;;) {
          const tip = dir === 1 ? chain[chain.length - 1] : chain[0];
          const next = (ends.get(tip) || []).find((m) => !used[m]);
          if (next === undefined) break;
          used[next] = 1;
          const other = segs[next][0] === tip ? segs[next][1] : segs[next][0];
          if (dir === 1) chain.push(other); else chain.unshift(other);
        }
      }
      if (chain.length > 6) lines.push(chain.map(pt));
    }
    for (const pts of lines) {
      const ys = pts.map((p) => p[1]);
      const depth = Math.min(1, Math.max(0, ((ys.reduce((a, b) => a + b, 0) / ys.length) - DATA.surfaceY) / (H - DATA.surfaceY)));
      let d = `M${r1(pts[0][0])} ${r1(pts[0][1])}`;
      for (let m = 1; m < pts.length - 1; m++) {
        const mx = (pts[m][0] + pts[m + 1][0]) / 2, my = (pts[m][1] + pts[m + 1][1]) / 2;
        d += `Q${r1(pts[m][0])} ${r1(pts[m][1])} ${r1(mx)} ${r1(my)}`;
      }
      const last = pts[pts.length - 1];
      d += `L${r1(last[0])} ${r1(last[1])}`;
      el("path", { d, "stroke-opacity": (0.09 + 0.17 * depth).toFixed(3) }, g);
    }
  }
}

// ---- Draw -------------------------------------------------------------------------------
el("rect", { x: 0, y: 0, width: W, height: H, fill: INK });
strata();

// The surface: how health usually gets judged.
el("rect", { x: 0, y: DATA.surfaceY - 2, width: W, height: 4, fill: PAPER });
const feelX = DATA.items[0].x - HEAD / 2;
const feel = el("text", { x: feelX, y: DATA.surfaceY - 34, class: "feel halo", "font-size": FEEL, fill: GRAPHITE, "stroke-width": 14 });
feel.textContent = DATA.feel;

const labels = [];
for (const item of DATA.items) {
  const vy = DATA.surfaceY + item.value * DATA.pxPerPoint;
  const g = el("g", {});
  // The plumb line, measured from the surface, ticked every percentage point.
  el("rect", { x: item.x - 2, y: DATA.surfaceY, width: 4, height: vy - DATA.surfaceY, fill: PAPER }, g);
  for (let p = 1; p <= Math.floor(item.value); p++) {
    const y = DATA.surfaceY + p * DATA.pxPerPoint;
    if (y > vy - HEAD / 2 - 4) break;
    const major = p % 5 === 0;
    el("rect", { x: item.x + 2, y: y - (major ? 1.5 : 1), width: major ? 22 : 12, height: major ? 3 : 2, fill: PAPER, "fill-opacity": major ? 0.95 : 0.55 }, g);
  }
  // The read-out: a square centred on the value.
  el("rect", { x: item.x - HEAD / 2, y: vy - HEAD / 2, width: HEAD, height: HEAD, fill: PAPER }, g);

  // Label: the number in display-num, then the name.
  const anchorX = item.align === "end" ? item.x + HEAD / 2 : item.x - HEAD / 2;
  const numY = vy + HEAD / 2 + 26 + Math.round(NUM * 0.72);
  const num = el("text", { x: anchorX, y: numY, class: "num halo", "font-size": NUM, fill: PAPER, "text-anchor": item.align, "stroke-width": 18 }, g);
  const [whole, frac] = String(item.value).split(".");
  num.textContent = frac ? `${whole}.${frac}` : whole;
  const pct = el("tspan", { "font-size": PCT, dx: 6, dy: -Math.round(NUM * 0.72 - PCT * 0.72) }, num);
  pct.textContent = "%";
  item.name.forEach((line, k) => {
    const t = el("text", { x: anchorX, y: numY + 30 + Math.round(NAME * 0.75) + k * NAME_LH, class: "name halo", "font-size": NAME, fill: PAPER, "text-anchor": item.align, "stroke-width": 14 }, g);
    t.textContent = line;
  });
  labels.push({ item, g, vy });
}

// ---- Checks: nothing that matters outside the safe zone, no label over another line --------
function checkSafeZone() {
  const problems = [];
  const boxes = labels.map(({ item, g }) => ({ item, b: g.getBBox() }));
  const fb = feel.getBBox();
  for (const { item, b } of [...boxes, { item: { value: "feel" }, b: fb }]) {
    if (b.x < SAFE.x0 || b.x + b.width > SAFE.x1 || b.y < SAFE.y0 || b.y + b.height > SAFE.y1)
      problems.push(`${item.value} outside safe zone: ${Math.round(b.x)},${Math.round(b.y)} ${Math.round(b.width)}x${Math.round(b.height)}`);
  }
  // A label's text must not sit on another item's plumb line.
  for (const { item, b } of boxes) for (const other of DATA.items) {
    if (other === item) continue;
    const oy = DATA.surfaceY + other.value * DATA.pxPerPoint;
    const textTop = DATA.surfaceY + item.value * DATA.pxPerPoint + HEAD / 2;
    if (other.x + 30 > b.x && other.x - 30 < b.x + b.width && oy > textTop) problems.push(`${item.value} label meets the ${other.value} line`);
  }
  document.body.dataset.report = JSON.stringify({ boxes: boxes.map(({ item, b }) => [item.value, Math.round(b.x), Math.round(b.y), Math.round(b.x + b.width), Math.round(b.y + b.height)]), feel: [Math.round(fb.x), Math.round(fb.y), Math.round(fb.x + fb.width), Math.round(fb.y + fb.height)], problems });
  if (problems.length) document.body.dataset.unsafe = problems.join("; ");
}
document.fonts.ready.then(() => { checkSafeZone(); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
